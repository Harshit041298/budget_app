# Optional: regenerate BillInsights.xcodeproj with XcodeGen
#   brew install xcodegen && xcodegen generate
name: BillInsights
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
packages:
  BillCore:
    path: Packages/BillCore
targets:
  BillInsights:
    type: application
    platform: iOS
    sources:
      - BillInsights
    dependencies:
      - package: BillCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.billinsights
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bill Insights
        INFOPLIST_KEY_NSCameraUsageDescription: The camera is used to scan paper bills and receipts. Images are processed on this iPhone only.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID keeps your financial data private.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose screenshots of bills or receipts to import.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
